<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>beatbox</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="upload.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <svg class="layout" viewBox="0 0 100 100" preserveAspectRatio="none">
    <g class="top-bar">
      <polygon class="top-bar__bg-fill"
        points="2,-2 102,-2 102,8 52,8 42,15 12,15 2,8"
        fill="#c0c0c0"
        stroke="none"
      />
      <polygon class="top-bar__fill"
        points="0,0 100,0 100,10 50,10 40,17 10,17 0,10"
        fill="white"
        stroke="black"
        stroke-width="0.2"
      />
    </g>

    <g class="side-bar">
      <polygon class="side-bar__bg-fill"
       points="0,20 5,23.5 5,70 25,70 28,73 28,95 65,95 70,100 0,100"
        fill="white"
        stroke="black"
        stroke-width="0.2"
      />
      <polygon class="side-bar__bg-fill"
        points="2,22 7,25.5 7,72 27,72 30,75 30,97 67,97 72,102 2,102"
        fill="#c0c0c0"
        stroke="none"
      />
      <polygon class="side-bar__fill"
        points="0,20 5,23.5 5,70 25,70 28,73 28,95 65,95 70,100 0,100"
        fill="white"
        stroke="black"
        stroke-width="0.2"
      />
      <!-- bookmarks star-->
      <polygon class="keep-aspect side-nav__star" data-cx="2.5" data-cy="27.8" points="2.5,26 3,27.5 4.5,27.5 3.3,28.4 3.8,30 2.5,29.1 1.2,30 1.7,28.4 0.5,27.5 2,27.5" fill="hotpink"/>
      <!-- envelope -->
      <g class="keep-aspect" data-cx="2.5" data-cy="34.4">
        <rect x="0.5" y="33" width="4" height="2.8" fill="none" stroke="black" stroke-width="0.2"/>
        <polyline points="0.5,33 2.5,34.6 4.5,33" fill="none" stroke="black" stroke-width="0.2"/>
      </g>
      <!-- upload -->
      <g class="btn upload keep-aspect" data-cx="2.5" data-cy="41" style="cursor:pointer">
        <title>Upload</title>
        <rect x="0.5" y="38.5" width="4" height="2.8" fill="white" stroke="black" stroke-width="0.2"/>
        <line x1="2.5" y1="41.3" x2="2.5" y2="43.5" stroke="black" stroke-width="0.2"/>
        <polygon points="1.5,41.8 2.5,40.8 3.5,41.8" fill="white" stroke="black" stroke-width="0.2"/>
      </g>
    </g>

    <g class="header-panel">
      <rect x="40" y="12" width="40" height="10" fill="white" stroke="black" stroke-width="0.2"/>
      <g class="header-buttons">
        <g class="btn list-view keep-aspect" data-cx="67" data-cy="17" style="cursor:pointer">
          <rect x="64" y="14" width="6" height="6" fill="#f3f3f3" stroke="black" stroke-width="0.2" rx="0.6"/>
          <title>List view</title>
          <rect x="65.2" y="14.3" width="3.6" height="0.5" fill="black"/>
          <rect x="65.2" y="16.6" width="3.6" height="0.5" fill="black"/>
          <rect x="65.2" y="18.9" width="3.6" height="0.5" fill="black"/>
        </g>
        <g class="btn carousel keep-aspect" data-cx="75.5" data-cy="17" style="cursor:pointer">
          <rect x="72.5" y="14" width="6" height="6" fill="#f3f3f3" stroke="black" stroke-width="0.2" rx="0.6"/>
          <title>Carousel mode</title>
          <rect x="74" y="15" width="2.9" height="4" fill="none" stroke="black" stroke-width="0.3"/>
        </g>
        <!-- dark mode toggle: sun/moon icon -->
        <g class="btn theme-toggle keep-aspect" data-cx="45" data-cy="17" style="cursor:pointer">
          <title>Toggle dark mode</title>
          <rect x="42" y="14" width="6" height="6" fill="#f3f3f3" stroke="black" stroke-width="0.2" rx="0.6"/>
          <!-- sun rays (visible in light mode) -->
          <g class="theme-icon--sun">
            <circle cx="45" cy="17" r="1.3" fill="none" stroke="black" stroke-width="0.3"/>
            <line x1="45" y1="14.6" x2="45" y2="15.3" stroke="black" stroke-width="0.25"/>
            <line x1="45" y1="18.7" x2="45" y2="19.4" stroke="black" stroke-width="0.25"/>
            <line x1="42.6" y1="17" x2="43.3" y2="17" stroke="black" stroke-width="0.25"/>
            <line x1="46.7" y1="17" x2="47.4" y2="17" stroke="black" stroke-width="0.25"/>
          </g>
          <!-- crescent moon (visible in dark mode) -->
          <g class="theme-icon--moon" style="display:none">
            <path d="M45.45,15.05 A2,2 0 1,0 45.45,18.95 A2,2 0 0,1 45.45,15.05 Z" fill="black" stroke="none"/>
          </g>
        </g>
      </g>
    </g>

    <g class="side-panel">
      <polygon class="side-panel__fill" points="5,71 24,71 27,74 27,94 5,94" fill="white" stroke="black" stroke-width="0.2"/>
    </g>

    <g class="bottom-panel">
      <polygon class="bottom-panel__fill"
        points="32,68.5 66,68.5 66,90 32,90"
        fill="white"
        stroke="black"
        stroke-width="0.3"
      />
      <line x1="42" y1="71" x2="56" y2="71" stroke="black" stroke-width="0.4"/>
      <!-- Invisible wide hit-line so the whole volume track is clickable, not
           just the knob. Click anywhere to jump the knob there. -->
      <line id="slider-track" x1="42" y1="71" x2="56" y2="71" stroke="transparent" stroke-width="4" style="cursor:pointer"/>
      <!-- NOT keep-aspect: that class counter-scales horizontally around a
           fixed origin (data-cx=49), which dragged the rendered knob back
           toward centre so it never reached the track ends. The knob's X
           position is its whole function, so it must map straight through. -->
      <circle id="slider-knob" data-cy="71" cx="49" cy="71" r="1.2" fill="white" stroke="black" stroke-width="0.2" style="cursor:pointer"/>
      <!-- prev -->
      <g class="keep-aspect" data-cx="42" data-cy="80.5">
        <circle class="prev" cx="42" cy="80.5" r="3" fill="white" stroke="black" stroke-width="0.2"/>
        <line x1="40.2" y1="79" x2="40.2" y2="82" stroke="black" stroke-width="0.4"/>
        <polygon points="43.6,79 40.6,80.5 43.6,82" fill="black"/>
      </g>
      <!-- next -->
      <g class="keep-aspect" data-cx="56" data-cy="80.5">
        <circle class="next" cx="56" cy="80.5" r="3" fill="white" stroke="black" stroke-width="0.2"/>
        <line x1="57.8" y1="79" x2="57.8" y2="82" stroke="black" stroke-width="0.4"/>
        <polygon points="54.4,79 57.4,80.5 54.4,82" fill="black"/>
      </g>
      <!-- play -->
      <g class="keep-aspect" data-cx="49" data-cy="80.5">
        <circle class="play-pause" cx="49" cy="80.5" r="4.5" fill="white" stroke="black" stroke-width="0.2"/>
        <polygon points="47.5,78.5 52,80.5 47.5,82.5" fill="black"/>
      </g>
      <!-- time -->
      <rect x="39" y="86" width="20" height="3" fill="none" stroke="black" stroke-width="0.2"/>
    </g>
  </svg>

  <div class="list-container">
    <table class="tracklist">
      <thead>
        <tr>
          <th class="col-play" aria-label="Play"></th>
          <th class="col-title">Title</th>
          <th class="col-artist">Artist</th>
          <th class="col-price">Price</th>
          <th class="col-time">Time</th>
          <th class="col-info" aria-label="More info"></th>
          <th class="col-star">★</th>
        </tr>
      </thead>
      <!-- Rows are rendered from beatBank by list-view.js. -->
      <tbody></tbody>
    </table>
  </div>

  <div class="carousel-container"></div>

  <!-- Upload overlay — shown/hidden by upload-toggle.js via .is-visible -->
  <div class="upload-container">
    <div class="upload-container__box">

      <!-- Window title bar: labels the window, drags it, and closes it. -->
      <div class="window-titlebar" id="uploadTitlebar">
        <span class="window-titlebar__label">Upload beat</span>
        <button class="window-titlebar__close" id="uploadClose" type="button" aria-label="Close">✕</button>
      </div>

      <div class="upload-form">

        <!-- Left: artwork drag/drop zone -->
        <div class="upload-form__artwork-zone" id="artworkZone">
          <svg class="artwork-placeholder" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <rect width="100" height="100" fill="#f5f5f5"/>
            <line x1="50" y1="28" x2="50" y2="72" stroke="#ccc" stroke-width="3" stroke-linecap="round"/>
            <line x1="28" y1="50" x2="72" y2="50" stroke="#ccc" stroke-width="3" stroke-linecap="round"/>
            <text x="50" y="89" text-anchor="middle" font-size="8"
              fill="#bbb" font-family="-apple-system, Helvetica Neue, sans-serif">
              drop artwork
            </text>
          </svg>
          <img class="artwork-preview" id="artworkPreview" alt="artwork preview"/>
        </div>

        <!-- Right: fields -->
        <div class="upload-form__fields">

          <div class="upload-form__audio-zone" id="audioZone">
            <div class="audio-zone__label" id="audioLabel">drop audio or click</div>
            <div class="audio-zone__filename" id="audioFilename"></div>
            <input type="file" id="audioFile" accept=".wav,.mp3"/>
          </div>

          <div class="upload-form__field">
            <label for="trackName">track name</label>
            <input type="text" id="trackName" placeholder="untitled" autocomplete="off"/>
          </div>

          <div class="upload-form__field">
            <label for="artistName">artist</label>
            <input type="text" id="artistName" placeholder="unknown" autocomplete="off"/>
          </div>

          <!-- BPM and key are the two fields buyers filter on first. -->
          <div class="upload-form__row">
            <div class="upload-form__field">
              <label for="trackBpm">bpm</label>
              <input type="text" id="trackBpm" placeholder="140" inputmode="numeric" autocomplete="off"/>
            </div>
            <div class="upload-form__field">
              <label for="trackKey">key</label>
              <input type="text" id="trackKey" placeholder="F min" autocomplete="off"/>
            </div>
          </div>

          <div class="upload-form__field">
            <label for="trackTags">tags</label>
            <input type="text" id="trackTags" placeholder="trap, dark, 808" autocomplete="off"/>
          </div>

          <!-- Give it away. Hides the pricing/preview machinery, since a
               free beat is served clean and carries no licence tiers. -->
          <label class="upload-form__check" for="isFree">
            <input type="checkbox" id="isFree"/>
            <span>give this beat away for free</span>
          </label>
          <p class="upload-form__note" id="freeNote"></p>

          <!-- How the public preview gets made. The clean file you upload
               above is never served publicly. -->
          <div class="upload-form__field">
            <label for="previewMode">preview</label>
            <select id="previewMode">
              <option value="platform">add a beatbox tag</option>
              <option value="own_tag">use my own tag</option>
              <option value="supplied">I'll upload my own tagged version</option>
            </select>
          </div>

          <div class="upload-form__preview-input" id="tagZone">
            <div class="audio-zone__label" id="tagLabel">drop your tag (max 3s)</div>
            <div class="audio-zone__filename" id="tagFilename"></div>
            <input type="file" id="tagFile" accept=".wav,.mp3"/>
          </div>

          <div class="upload-form__preview-input" id="previewZone">
            <div class="audio-zone__label" id="previewLabel">drop your tagged preview</div>
            <div class="audio-zone__filename" id="previewFilename"></div>
            <input type="file" id="previewFile" accept=".wav,.mp3"/>
          </div>

          <!-- Rights declaration. createBeat() refuses without this, and a
               beat with no declaration cannot be traded. -->
          <label class="upload-form__check" for="rightsWarrant">
            <input type="checkbox" id="rightsWarrant"/>
            <span id="rightsWarrantText">I hold the rights to this beat</span>
          </label>

          <label class="upload-form__check" for="containsSamples">
            <input type="checkbox" id="containsSamples"/>
            <span>it contains third-party samples</span>
          </label>

          <div class="upload-form__field upload-form__samples" id="sampleNotesWrap">
            <label for="sampleNotes">sample details</label>
            <input type="text" id="sampleNotes" placeholder="what, and cleared how" autocomplete="off"/>
          </div>

          <p class="upload-form__status" id="uploadStatus"></p>

          <button class="upload-form__submit" id="uploadSubmit">upload</button>

        </div>
      </div>
    </div>
  </div>

  <script>
    const knob = document.getElementById('slider-knob');
    const track = document.getElementById('slider-track');
    const svg  = document.querySelector('svg.layout');
    const minX = 42, maxX = 56;
    let dragging = false;

    // Move the knob to wherever the pointer is along the track (clamped).
    const setFromEvent = e => {
      const rect = svg.getBoundingClientRect();
      const svgX = (e.clientX - rect.left) / rect.width * 100;
      knob.setAttribute('cx', Math.min(maxX, Math.max(minX, svgX)));
    };

    knob.addEventListener('mousedown',  e => { dragging = true; e.preventDefault(); });
    // Clicking anywhere on the track jumps the knob there and starts a drag,
    // so the volume is settable without grabbing the small knob first.
    track.addEventListener('mousedown', e => { dragging = true; setFromEvent(e); e.preventDefault(); });
    window.addEventListener('mouseup',   () => { dragging = false; });
    window.addEventListener('mousemove', e => { if (dragging) setFromEvent(e); });
  </script>
  <script src="aspect-fix.js"></script>
  <script src="theme-toggle.js"></script>
  <script src="beat-data.js"></script>
  <script src="carousel.js"></script>
  <script src="list-view.js"></script>
  <script src="view-toggle.js"></script>
  <script src="upload-toggle.js"></script>
  <script src="upload.js"></script>
  <script src="transport.js"></script>
  <!-- Data layer. Deferred by default as a module, so it runs after the
       classic scripts above have defined beatBank and beatCarousel. -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
